<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短影音 Reels｜ZJ影像</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    .section {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 clamp(24px, 6vw, 80px);
    }

    h2 {
      color: #a88d65;
      border-bottom: 2px solid #a88d65;
      padding-bottom: .5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    footer {
      background: #f9f7f2;
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #999;
    }

    /* ===== 短影音響應式網格系統 ===== */
    .video-grid {
      display: grid;
      /* 當螢幕空間不夠時，會自動從小於 290px 開始轉為單欄垂直排列 */
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 2.5rem;
      justify-items: center;
      margin-top: 2rem;
    }

    .video-card {
      width: 100%;
      max-width: 320px; /* 限制單個卡片最大寬度，保持視覺美感 */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      /* 強制外殼維持直式短影音 9:16 的比例 */
      aspect-ratio: 9 / 16;
      position: relative;
    }

    .video-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="navbar"></div>
  <script>
    fetch("components/navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
        // ... 原有的 Navbar 漢堡選單邏輯
        const menuToggle = document.getElementById("menu-toggle");
        const menu = document.getElementById("menu");
        const overlay = document.createElement("div");
        overlay.id = "overlay";

        if(menuToggle) {
          menuToggle.addEventListener("click", () => {
            menu.classList.toggle("open");
            overlay.classList.toggle("show");
          });
        }
        // ... 略過其餘不變的 navbar js
      });
  </script>

  <!-- 短影音 Reels 展示區塊 -->
  <section class="section">
    <h2>短影音 Reels</h2>
    <div class="video-grid">
      
      <!-- 第一支短影片 -->
      <div class="video-card">
        <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F822892113835709%2F&show_text=false&width=267&t=0" width="267" height="476" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowFullScreen="true"></iframe>
      </div>
      
      <!-- 第二支短影片 -->
      <div class="video-card">
        <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F992761683699154%2F&show_text=false&width=267&t=0" width="267" height="476" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowFullScreen="true"></iframe>
      </div>
      
      <!-- 第三支短影片 -->
      <div class="video-card">
        <iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1517580093444541%2F&show_text=false&width=267&t=0" width="267" height="476" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowFullScreen="true"></iframe>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 ZJ影像. All Rights Reserved.</p>
  </footer>
</body>
</html>
